[package]
name = "tw-nhi-icc-service"
version = "0.3.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/tw-nhi-icc-service"
homepage = "https://magiclen.org/tw-nhi-icc"
publish = false
keywords = ["smart-card", "pcsc", "nhi-card", "ic-card", "taiwan"]
categories = ["command-line-utilities"]
description = "Read Taiwan NHI cards via HTTP API. 透過 HTTP API 讀取中華民國健保卡。"
license = "MIT"
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
concat-with = "0.2"
terminal_size = "0.4"

anyhow = "1"

tokio = { version = "1", features = ["full"] }

tracing = "0.1"
enable-ansi-support = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["trace", "set-header", "cors"] }

utoipa = { version = "6", features = ["chrono", "preserve_order", "preserve_path_order"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored", "gzip"] }

pcsc = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
encoding_rs = "0.8"
